name : my first workflow
#on: [push,workflow_dispatch]
on:
  schedule:
    - cron: "*/5 * * * *"
 
jobs:
  job1:
    name : job1
    runs-on: ubuntu-latest
    steps:
      - name: Running single command in job1
        run: echo " This is my first workflow"
      - name: Checking OS Release for LInux Github hosted env"
        run : cat /etc/os-release
      - name: calling sleep
        run: sleep 20  
  job2:
    name : job2
    needs : job1
    runs-on: ubuntu-latest
    steps:
      - name: Checking the name of the hostname
        run: hostname
      - name: Running Multiple commands
        run : |
         echo "Hi This is from arao changing label"
         echo "Current time is `date` "
         sleep 20 
  job3:
    name: JOB3
    needs: job2
    runs-on: ubuntu-latest
    steps:
      - name: Job with Single Dependency
        run: sleep 10
  job4:
    name: JOB4
    needs : job3
    runs-on: ubuntu-latest
    steps:
      - name: Job for multiple dependencies
        run: sleep 10         